[project]
name = "ductile-docling"
version = "0.1.0"
description = "Bespoke FastAPI worker: PDF → Markdown via IBM docling. Sidecar to the ductile gateway."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "Matt Joyce" }]

dependencies = [
    "docling>=2.0,<3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",          # FastAPI TestClient backend
]

[project.urls]
Homepage = "https://github.com/mattjoyce/ductile-docling"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["worker*"]
